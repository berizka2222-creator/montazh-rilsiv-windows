<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion embed demo</title>
<style>body{margin:0;background:#070c07;color:#F3F4EC;font-family:system-ui;display:grid;gap:24px;padding:24px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}</style>
</head><body>
<div data-motion="HookTitle" data-props='{"eyebrow":"Meta Ads","text":"Приклад / *заголовка*","chrome":"1"}' data-loop data-autoplay></div>
<div data-motion="CtaEnd" data-props='{"title":"Привіт, *гостю*","button":"Текст кнопки","format":"4:5"}' data-url-props="name:title" data-loop data-play="view"></div>
<div data-motion="Counter" data-props='{"value":100,"suffix":"%","label":"підпис","format":"1:1"}' data-loop data-autoplay data-controls></div>
<script src="motion-assets/motion-embed.js"></script>
</body></html>
