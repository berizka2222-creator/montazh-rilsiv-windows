<!doctype html>
<!-- rf-stopwatch: a small pill with a stopwatch that counts the reel's time (proof «зроблено за хвилину»).
     Own motion of the reel skill (reference reel 2026-10-26). build_reel fills seconds + brand colours. -->
<html lang="uk" data-composition-id="rf-stopwatch" data-composition-duration="600" data-width="1080" data-height="1920" data-composition-variables='[
  { "id": "seconds", "type": "number", "label": "Тривалість картки, с", "default": 60 },
  { "id": "from", "type": "number", "label": "З якої секунди почати відлік", "default": 0 },
  { "id": "y", "type": "number", "label": "Висота пігулки (px від верху)", "default": 240 },
  { "id": "brand_pop", "type": "color", "label": "Колір пігулки", "default": "#FFC3CC" },
  { "id": "brand_main", "type": "color", "label": "Колір цифр", "default": "#0D1A0F" }
]'>
  <head><meta charset="UTF-8" /><title>rf-stopwatch</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="rf-stopwatch" data-duration="600" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; }
          .rfsw { position: absolute; right: 56px; top: 250px; display: flex; align-items: center; gap: 12px;
                  padding: 14px 26px 14px 20px; border-radius: 999px; font-family: var(--font-body, sans-serif);
                  font-size: 40px; font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums;
                  box-shadow: 0 10px 30px rgba(0,0,0,.18); transform-origin: 100% 50%; opacity: 0; }
          .rfsw svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
          .rfsw .hand { transform-origin: 12px 13.5px; }
        </style>
        <div class="rfsw"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="8" /><path d="M9.5 2.5h5M12 2.5v3" /><path class="hand" d="M12 13.5V9" /></svg><span class="t">00:00,0</span></div>
        <script>
          (function () {
            var v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
            var secs = Math.max(1, +v.seconds || 60), from = +v.from || 0;
            var el = document.querySelector(".rfsw"), t = el.querySelector(".t"), hand = el.querySelector(".hand");
            el.style.top = (+v.y || 240) + "px";
            el.style.background = v.brand_pop || "#FFC3CC";
            el.style.color = v.brand_main || "#0D1A0F";
            function fmt(s) { var m = Math.floor(s / 60), r = s - m * 60;
              return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r.toFixed(1).replace(".", ","); }
            var clock = { s: 0 };
            var tl = gsap.timeline({ paused: true });
            tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.05);
            tl.fromTo(clock, { s: 0 }, { s: secs, duration: secs, ease: "none",
              onUpdate: function () { t.textContent = fmt(from + clock.s); hand.style.transform = "rotate(" + ((from + clock.s) * 360 % 360) + "deg)"; } }, 0);
            tl.to(el, { opacity: 0, scale: 0.8, duration: 0.25, ease: "power2.in" }, Math.max(0.5, secs - 0.3));
            window.__timelines = window.__timelines || {};
            window.__timelines["rf-stopwatch"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
