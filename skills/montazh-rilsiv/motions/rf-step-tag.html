<!doctype html>
<!-- rf-step-tag: a big «[2]» step number beside the head (step-by-step reels, splits).
     Own motion of the reel skill (reference reel 2026-10-26). build_reel fills face + seconds. -->
<html lang="uk" data-composition-id="rf-step-tag" data-composition-duration="600" data-width="1080" data-height="1920" data-composition-variables='[
  { "id": "step", "type": "string", "label": "Номер кроку", "default": "1" },
  { "id": "side", "type": "enum", "label": "Збоку від голови", "default": "right", "options": [{ "value": "right", "label": "праворуч" }, { "value": "left", "label": "ліворуч" }] },
  { "id": "face", "type": "json", "label": "Обличчя [x, y, w, h]", "default": [300, 500, 480, 600] },
  { "id": "seconds", "type": "number", "label": "Тривалість картки, с", "default": 4 },
  { "id": "brand_light", "type": "color", "label": "Колір", "default": "#FFFFFF" }
]'>
  <head><meta charset="UTF-8" /><title>rf-step-tag</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="rf-step-tag" data-duration="600" data-fps="30">
        <style>
          #root { position: absolute; inset: 0; }
          .rfst { position: absolute; display: flex; align-items: center; font-family: var(--font-body, sans-serif);
                  font-weight: 400; font-size: 120px; line-height: 1; text-shadow: 0 4px 24px rgba(0,0,0,.35); opacity: 0; }
          .rfst b { font-weight: 400; display: inline-block; }
          .rfst .n { font-family: var(--font-display, sans-serif); font-weight: 700; padding: 0 .06em; }
        </style>
        <div class="rfst"><b class="l">[</b><b class="n">1</b><b class="r">]</b></div>
        <script>
          (function () {
            var v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
            var f = Array.isArray(v.face) ? v.face : [300, 500, 480, 600], secs = Math.max(1, +v.seconds || 4);
            var el = document.querySelector(".rfst");
            el.querySelector(".n").textContent = String(v.step || "1");
            el.style.color = v.brand_light || "#FFFFFF";
            // beside the head, outside the face box, never past the frame edge
            var top = Math.max(250, f[1] - 45);   // over the hair line, above the emoji caption row (it sits at eye level)
            if (v.side === "left") el.style.right = Math.min(Math.max(1080 - f[0] + 24, 40), 1080 - 260) + "px";
            else el.style.left = Math.min(f[0] + f[2] + 24, 1080 - 260) + "px";
            el.style.top = top + "px";
            var tl = gsap.timeline({ paused: true });
            tl.set(el, { opacity: 1 }, 0.05);
            tl.fromTo(el.querySelector(".l"), { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.05);
            tl.fromTo(el.querySelector(".r"), { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.05);
            tl.fromTo(el.querySelector(".n"), { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.2)" }, 0.15);
            tl.to(el, { opacity: 0, duration: 0.25, ease: "power2.in" }, Math.max(0.6, secs - 0.3));
            window.__timelines = window.__timelines || {};
            window.__timelines["rf-step-tag"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
